<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<!-- Self-hosted, latin-subset variable fonts. Preloaded because both are
		     used above the fold and `font-display: swap` would otherwise show a
		     fallback flash on first paint. -->
		<link
			rel="preload"
			href="/fonts/source-sans-3-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/playfair-display-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>

		<!-- Scroll reveals start hidden and are unhidden by an IntersectionObserver.
		     Without JS that observer never runs, so unhide everything up front
		     rather than serving a blank page. -->
		<noscript>
			<style>
				.reveal {
					opacity: 1 !important;
					transform: none !important;
				}
			</style>
		</noscript>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
